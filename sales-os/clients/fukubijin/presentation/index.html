<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福美水 ご提案資料｜SU初回商談</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --porcelain:#FBF8F2;--porcelain2:#F4EFE5;--mist:#E9EFE8;--mist2:#DEE8DC;
  --sasa:#2C3E33;--sasa2:#3B5346;--celadon:#8AA491;--celadon-dk:#5C7864;
  --petal:#C0897B;--gold:#BFA469;--ink:#37342C;--muted:#837C6E;--hair:rgba(44,62,51,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#DCE4DB;font-family:"Noto Sans JP",sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2.4vw}
.slide{position:absolute;width:min(1160px,94vw);height:min(658px,90vh);
  background:radial-gradient(130% 100% at 88% -8%,rgba(138,164,145,.16),transparent 55%),radial-gradient(120% 120% at 0% 108%,rgba(191,164,105,.07),transparent 50%),var(--porcelain);
  box-shadow:0 34px 90px -34px rgba(35,50,40,.55);padding:60px 74px 56px;display:none;flex-direction:column;
  opacity:0;transform:translateY(12px);transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1);overflow:hidden}
.slide.active{display:flex;opacity:1;transform:none}
.slide .botanical{position:absolute;right:-40px;bottom:-56px;width:340px;opacity:.09;pointer-events:none;color:var(--celadon-dk)}
.slide .botanical svg{width:100%;height:auto}
.eyebrow{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.eyebrow .en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:var(--celadon-dk);letter-spacing:.06em}
.eyebrow .jp{font-size:11px;letter-spacing:.34em;color:var(--gold);font-weight:500}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold)}
h1,h2{font-family:"Shippori Mincho",serif;color:var(--sasa);line-height:1.34;font-weight:500}
h1{font-size:46px;letter-spacing:.03em}
h2{font-size:31px;letter-spacing:.02em;font-weight:600}
.lede{font-size:15.5px;color:var(--muted);line-height:2.05;margin-top:16px;font-weight:300;max-width:58ch}
.hairline{height:1px;background:var(--hair);margin:22px 0}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;position:relative;z-index:2}
.pagefoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:18px;position:relative;z-index:2}
.pagefoot .lab{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14px;color:var(--muted);letter-spacing:.05em}
.pagefoot .n{font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--celadon-dk);letter-spacing:.14em}
.pagefoot .n b{color:var(--sasa);font-weight:500}
ul.clean{list-style:none;display:flex;flex-direction:column;gap:14px}
ul.clean li{position:relative;padding-left:24px;font-size:16px;line-height:1.85;font-weight:300}
ul.clean li::before{content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:50%;border:1px solid var(--celadon-dk);background:var(--porcelain)}
ul.clean li b{color:var(--sasa);font-weight:600}
ul.clean li .accent{color:var(--petal);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px 30px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.panel{background:linear-gradient(180deg,var(--mist),#EEF3ED);border:1px solid rgba(92,120,100,.18);padding:22px 24px;position:relative;border-radius:3px}
.panel::before{content:"";position:absolute;left:0;top:0;width:34px;height:2px;background:var(--celadon-dk)}
.panel.warm::before{background:var(--petal)}
.panel h3{font-family:"Shippori Mincho",serif;font-size:17px;color:var(--sasa);margin-bottom:12px;font-weight:600;letter-spacing:.02em}
.panel p,.panel li{font-size:13.5px;line-height:1.78;color:var(--ink);font-weight:300}
.panel ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.panel ul li{position:relative;padding-left:15px}
.panel ul li::before{content:"";position:absolute;left:0;top:.66em;width:5px;height:5px;border-radius:50%;background:var(--celadon)}
.klabel{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;letter-spacing:.06em;color:var(--celadon-dk);display:block;margin-bottom:6px}
.contrast{display:grid;grid-template-columns:1fr 1.32fr;gap:28px;align-items:stretch}
.xbox{background:var(--porcelain2);border:1px solid var(--hair);padding:26px;display:flex;flex-direction:column;justify-content:center}
.xbox .tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;color:var(--muted);letter-spacing:.05em;margin-bottom:12px}
.xbox p{font-size:18px;line-height:1.62;font-family:"Shippori Mincho",serif;color:var(--muted);font-weight:400}
.obox{background:radial-gradient(120% 130% at 100% 0%,rgba(138,164,145,.22),transparent 60%),var(--sasa);color:#EAEFE7;padding:30px 32px;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.obox::after{content:"";position:absolute;right:22px;top:22px;width:44px;height:44px;border:1px solid rgba(191,164,105,.5);border-radius:50%}
.obox .tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px;color:var(--gold);letter-spacing:.05em;margin-bottom:14px}
.obox p{font-size:22px;line-height:1.6;font-family:"Shippori Mincho",serif;font-weight:500}
.obox p .em{color:#E4B7AB}
.obox .sub{font-size:13.5px;line-height:1.85;color:#C4D0C3;margin-top:16px;font-family:"Noto Sans JP";font-weight:300}
.readout{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.85;font-weight:300;display:flex;gap:9px;align-items:flex-start}
.readout .drop{color:var(--petal);flex:none;margin-top:2px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:11px 9px}
.chip{background:var(--mist);border:1px solid rgba(92,120,100,.2);padding:12px 17px;font-size:13.5px;font-weight:400;color:var(--sasa);border-radius:2px}
.chip.hot{background:var(--sasa);color:#EAEFE7;border-color:var(--sasa)}
.arw{color:var(--celadon);font-family:"Cormorant Garamond",serif;font-size:18px}
.cover{padding:0}
.cover .inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 74px}
.cover .en-brand{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;letter-spacing:.12em;color:var(--celadon-dk);margin-bottom:8px}
.cover .en-sub{font-size:11px;letter-spacing:.42em;color:var(--gold);font-weight:500;margin-bottom:38px}
.cover h1{font-size:66px;font-weight:500;letter-spacing:.05em;margin-bottom:26px;color:var(--sasa)}
.cover .tag{font-family:"Shippori Mincho",serif;font-size:20px;color:var(--celadon-dk);line-height:1.85;font-weight:400;max-width:42ch}
.cover .meta{margin-top:46px;font-size:12.5px;letter-spacing:.08em;color:var(--muted);line-height:2.1;font-weight:300}
.cover .meta .en{font-family:"Cormorant Garamond",serif;font-style:italic}
.drop-mark{position:absolute;right:78px;top:64px;width:96px;height:96px;z-index:3}
.drop-mark svg{width:100%;height:100%}
.ripple{transform-origin:center;animation:rip 4.2s ease-out infinite}
.ripple.d2{animation-delay:1.4s}.ripple.d3{animation-delay:2.8s}
@keyframes rip{0%{transform:scale(.35);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.note-inline{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.85;font-weight:300}
.note-inline b{color:var(--sasa);font-weight:600}
.pill{display:inline-block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:13px;color:var(--celadon-dk);border:1px solid var(--celadon);padding:1px 10px;border-radius:20px;margin-right:6px;letter-spacing:.03em}
.pill.v{color:var(--petal);border-color:var(--petal)}
.two-col{columns:2;column-gap:34px}.two-col li{break-inside:avoid;position:relative;padding-left:15px;margin-bottom:8px}
.two-col li::before{content:"";position:absolute;left:0;top:.66em;width:5px;height:5px;border-radius:50%;background:var(--celadon)}
.hud{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;z-index:40}
.hud button{background:rgba(251,248,242,.94);border:1px solid rgba(92,120,100,.25);color:var(--sasa);font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.04em;padding:8px 14px;border-radius:20px;cursor:pointer;transition:.2s}
.hud button:hover{background:#fff;border-color:var(--celadon)}
.hud .prog{font-family:"Cormorant Garamond",serif;color:var(--sasa);font-size:14px;letter-spacing:.12em;min-width:60px;text-align:center}
.bar{position:fixed;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--celadon),var(--gold));z-index:40;transition:width .5s}
.hint{position:fixed;bottom:16px;right:18px;color:rgba(55,52,44,.4);font-size:11px;letter-spacing:.06em;z-index:39}
.notes{position:fixed;right:0;top:0;bottom:0;width:min(420px,86vw);background:#1E2621;color:#DCE5DA;transform:translateX(100%);transition:transform .4s ease;z-index:50;padding:34px 32px 40px;overflow-y:auto;box-shadow:-24px 0 70px -24px rgba(0,0,0,.6)}
.notes.open{transform:none}
.notes h4{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-size:17px;letter-spacing:.08em;margin-bottom:4px}
.notes .nt-title{font-family:"Shippori Mincho",serif;font-size:20px;color:#fff;margin:6px 0 18px;line-height:1.45;font-weight:500}
.notes .nt-body{font-size:14px;line-height:2;color:#C6CFC3;white-space:pre-line;font-weight:300}
.notes .nt-body strong{color:#E4B7AB;font-weight:600}
.notes .close{position:absolute;top:18px;right:20px;background:none;border:1px solid #3e4a41;color:#aeb8ac;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px}
@media (max-width:680px){
  .stage{padding:0}
  .slide{
    inset:0;width:100%;max-width:100%;
    height:100vh;height:100dvh;max-height:none;
    border-radius:0;box-shadow:none;
    padding:calc(22px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    justify-content:flex-start;
  }
  .body{flex:none;justify-content:flex-start}
  .slide .botanical{display:none}
  .pagefoot{display:none}
  .hint{display:none}
  /* neutralize the large inline top-margins from desktop spacing */
  .slide [style*="margin-top"]{margin-top:14px!important}

  .eyebrow{margin-bottom:14px;flex-wrap:wrap;gap:6px 10px}
  .eyebrow::before{width:18px}
  .eyebrow .en{font-size:15px}
  .eyebrow .jp{font-size:9.5px;letter-spacing:.18em}

  h1{font-size:clamp(25px,7.4vw,34px);line-height:1.32}
  h2{font-size:clamp(18px,5.3vw,24px);line-height:1.42}
  .lede{font-size:13px;line-height:1.85;margin-top:12px;max-width:none}
  .hairline{margin:14px 0}

  ul.clean{gap:9px}
  ul.clean li{font-size:13.5px;line-height:1.72;padding-left:19px}
  ul.clean li::before{top:.62em}

  .grid2,.grid3,.contrast{grid-template-columns:1fr;gap:11px}
  .panel{padding:14px 16px}
  .panel::before{width:28px}
  .panel h3{font-size:14.5px;margin-bottom:7px}
  .panel p,.panel li{font-size:12.5px;line-height:1.66}
  .panel ul{gap:6px}
  .klabel{font-size:13px;margin-bottom:4px}

  .xbox{padding:16px}
  .xbox .tag{font-size:13px;margin-bottom:8px}
  .xbox p{font-size:15px}
  .obox{padding:18px 18px}
  .obox::after{width:32px;height:32px;top:16px;right:16px}
  .obox .tag{font-size:13px;margin-bottom:10px}
  .obox p{font-size:16.5px;line-height:1.55}
  .obox .sub{font-size:12px;margin-top:10px;line-height:1.7}
  .readout{font-size:12px;margin-top:12px}
  .note-inline{font-size:11.5px;margin-top:12px;line-height:1.75}
  .pill{font-size:12px}

  .flow{gap:7px 6px}
  .chip{padding:9px 12px;font-size:12px}
  .arw{font-size:14px}
  .two-col{column-gap:16px}
  .two-col li{font-size:12.5px;margin-bottom:6px}

  /* cover as centered portrait */
  .cover .inner{padding:calc(24px + env(safe-area-inset-top)) 24px 24px;justify-content:center;min-height:calc(100dvh - 90px)}
  .cover .drop-mark{position:absolute;width:52px;height:52px;right:20px;top:calc(18px + env(safe-area-inset-top))}
  .cover .en-brand{font-size:19px;margin-bottom:6px}
  .cover .en-sub{font-size:9px;letter-spacing:.24em;margin-bottom:26px;line-height:1.8}
  .cover h1{font-size:clamp(30px,8.6vw,42px);margin-bottom:20px}
  .cover .tag{font-size:16px;line-height:1.75;max-width:none}
  .cover .meta{margin-top:30px;font-size:11.5px;line-height:2}

  .hud{gap:5px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .hud button{padding:8px 11px;font-size:11px}
  .hud .prog{font-size:13px;min-width:50px}
}
@media (max-width:680px) and (min-height:720px){
  /* roomy phones: gently center content vertically */
  .slide{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.ripple{animation:none!important}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="stage" id="stage"></div>
<div class="hud">
  <button onclick="go(-1)">◀ 前へ</button>
  <span class="prog" id="prog">01 / 14</span>
  <button onclick="go(1)">次へ ▶</button>
  <button onclick="toggleNotes()" title="発表者ノート (N)">ノート</button>
  <button onclick="fs()" title="全画面 (F)">全画面</button>
</div>
<div class="hint">← → 移動 ／ N ノート ／ F 全画面</div>
<aside class="notes" id="notes">
  <button class="close" onclick="toggleNotes()">✕</button>
  <h4>Presenter Note</h4>
  <div class="nt-title" id="nt-title"></div>
  <div class="nt-body" id="nt-body"></div>
</aside>
<script>
const LEAF = `<svg viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-width="1.4">
<path d="M150 285 C150 200 150 120 150 40"/>
<path d="M150 235 C110 220 82 188 74 150"/><path d="M150 205 C120 196 98 172 92 142"/>
<path d="M150 175 C120 168 100 146 96 120"/><path d="M150 250 C190 236 218 205 226 168"/>
<path d="M150 218 C182 210 205 186 210 158"/><path d="M150 188 C178 181 198 160 202 136"/>
<path d="M150 158 C176 152 194 133 197 112"/></svg>`;
const DROP = `<svg viewBox="0 0 100 100">
<g fill="none" stroke="#8AA491" stroke-width="1">
<circle class="ripple" cx="50" cy="54" r="30"/><circle class="ripple d2" cx="50" cy="54" r="30"/><circle class="ripple d3" cx="50" cy="54" r="30"/></g>
<path d="M50 20 C50 20 33 42 33 55 a17 17 0 0 0 34 0 C67 42 50 20 50 20 Z" fill="#8AA491" opacity=".9"/>
<path d="M44 50 a7 7 0 0 0 5 11" fill="none" stroke="#FBF8F2" stroke-width="1.4" stroke-linecap="round" opacity=".85"/></svg>`;

const slides = [
{html:`<div class="slide cover">
  <div class="drop-mark">${DROP}</div><div class="botanical">${LEAF}</div>
  <div class="inner">
    <div class="en-brand">Fukubisui</div>
    <div class="en-sub">J A P A N E S E &nbsp; B O T A N I C A L &nbsp; S K I N C A R E</div>
    <h1>福美水　ご提案資料</h1>
    <div class="tag">施術後ケア・店販・アメニティ導線をつくる<br>スキンケア提案</div>
    <div class="meta"><span class="en">For</span>　＿＿＿＿＿＿＿＿＿ 様<br>
      <span class="en">Date</span>　2026年＿月＿日　／　<span class="en">Presenter</span>　＿＿＿＿</div>
  </div></div>`,
title:"表紙",
note:`つかみは商品ではなく“場の定義”。\n\n「本日はお時間ありがとうございます。福美人の〇〇です。本日は化粧水の売り込みというより、御社のお客様にどんな場面でお役立てできそうかを、一緒に確認できればと思っています」\n\n<strong>ここで売り込み臭を消す。</strong>御中名・日付・担当は事前に差し替える。`},

{html:`<div class="slide"><div class="eyebrow"><span class="en">Purpose</span><span class="jp">本日の目的</span></div>
  <div class="body">
    <h2>商品紹介ではなく、<br>“御社のお客様に合う利用シーン”を一緒に確認する場です</h2>
    <div class="hairline"></div>
    <ul class="clean">
      <li>成分やスペックの説明を聞いていただく時間ではありません。</li>
      <li>御社のお客様の肌ケア・物販・アメニティの<b>現状</b>をうかがい、福美水が自然に置ける場面があるかを見極めます。</li>
    </ul>
    <div class="grid3" style="margin-top:26px">
      <div class="panel"><span class="klabel">Check 01</span><p>肌ケア・物販・アメニティまわりの現状</p></div>
      <div class="panel"><span class="klabel">Check 02</span><p>福美水が合いそうな利用シーン</p></div>
      <div class="panel warm"><span class="klabel">Check 03</span><p>（サンプル後）導入アイテム・時期・数量感</p></div>
    </div>
  </div>
  <div class="pagefoot"><span class="lab">Fukubisui</span><span class="n"><b>02</b> / 14</span></div></div>`,
title:"本日の目的",
note:`ゴールの握り。<strong>「今日は決めていただく場ではない」</strong>と明言してハードルを下げる。\n\n「本日は3点だけ確認させてください。①肌ケアや物販の今の形、②福美水が合いそうな場面、③もしサンプルを見ていただけるなら、どのアイテム・時期・数量が現実的か」\n\nCheck03を先に予告しておくと、後半のサンプル3点取得が自然になる。`},

{html:`<div class="slide"><div class="eyebrow"><span class="en">The Gap</span><span class="jp">業態共通の課題</span></div>
  <div class="body">
    <h2>「施術後・利用後に肌が敏感になる瞬間」は、<br>どの業態にもある</h2>
    <div class="lede">レーザー・ピーリング・脱毛・カラー・パーマ、あるいは長旅のあと。肌が一時的にゆらぎやすくなる瞬間は、業態を問わず必ず訪れます。</div>
    <div class="contrast" style="margin-top:24px">
      <div class="xbox"><span class="tag">現場でよくある状態</span><p>高額な院内専売品を案内するか、<br>あるいは何もお渡ししないか、の二択。</p></div>
      <div class="obox"><span class="tag">見えている歪み</span>
        <p>“施術後ケアの標準解”が、<br>業態を横断して<span class="em">存在していない</span></p>
        <div class="sub">敏感肌向け＝「守り」、美肌・エイジング＝「攻め」で分断され、施設側が全員に安心して案内できる共通ケアが空白のまま。</div></div>
    </div>
    <div class="readout"><span class="drop">◇</span><span>商談の入口はこの一言：「施術後に肌が敏感になったお客様へ、御社では何を案内されていますか？」</span></div>
  </div>
  <div class="pagefoot"><span class="lab">Fukubisui</span><span class="n"><b>03</b> / 14</span></div></div>`,
title:"業態共通の課題",
note:`成分説明から入らない。<strong>相手の現場の“空白”を先に言語化する。</strong>\n\n「施術やサービスのあと、肌が一時的に敏感になるお客様っていらっしゃいますよね。そういう方に、御社では今、何を案内されていますか？」\n\n相手に喋らせる。「高い専売品しかない」「特に何も」——どちらが出ても福美水を置く“理由”になる。歪みの核：<strong>施術後ケアに業態横断の共通言語がない。</strong>`},

{html:`<div class="slide"><div class="eyebrow"><span class="en">Redefined</span><span class="jp">福美水の再定義</span></div>
  <div class="body">
    <h2>「低刺激スキンケア」ではありません</h2>
    <div class="contrast" style="margin-top:26px">

      <li><b>C</b>：サンプル希望のみ　／　<b>D</b>：情報収集のみ　／　<span class="accent">NG</span>：導入余地なし</li>
    </ul>
  </div>
  <div class="pagefoot"><span class="lab">Fukubisui</span><span class="n"><b>13</b> / 14</span></div></div>`,
title:"ヒアリング項目",
note:`相手に読み上げる用でなく、<strong>商談者の手元チェックリスト</strong>。\n\n会話の中で自然に埋める。右側（アイテム・時期・数量・使用感確認日）はサンプル送付の可否を分ける必須4点。\n\n商談後は必ず温度感ランク（A〜NG）を記録。Aは即トスアップ、Bは使用感確認後、C/Dは追客、NGは除外。基準を毎回同じにすると業態別の反応率が比較できる。`},

{html:`<div class="slide"><div class="eyebrow"><span class="en">Next Step</span><span class="jp">次のアクション</span></div>

note:`クロージングは“決断”でなく“次の日程”を取る。\n\n「本日のお話だと、御社の場合は〇〇の場面で試していただくのが一番自然だと感じました。まずサンプルをお送りするので、使用感を確認するお時間だけ、仮でこの場で押さえさせてください」\n\n<strong>最終ゴールは「サンプル送付＋使用感確認日の確定＋3点」。</strong>ここまで取れれば商談化はほぼ握れている。`}
];

const stage=document.getElementById('stage');
slides.forEach((s,i)=>{const d=document.createElement('div');d.innerHTML=s.html;const el=d.firstElementChild;el.dataset.i=i;stage.appendChild(el);});
const els=[...document.querySelectorAll('.slide')];
let cur=0;
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  els.forEach((e,k)=>e.classList.toggle('active',k===cur));
  document.getElementById('prog').textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('nt-title').textContent=(cur+1)+'. '+slides[cur].title;
  document.getElementById('nt-body').innerHTML=slides[cur].note;
}
function go(d){show(cur+d)}
function toggleNotes(){document.getElementById('notes').classList.toggle('open')}
function fs(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else{document.exitFullscreen()}}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}
  else if(e.key.toLowerCase()==='n'){toggleNotes()}
  else if(e.key.toLowerCase()==='f'){fs()}
  else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(slides.length-1)}
});
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6) go(dx<0?1:-1);
},{passive:true});
// keep the current slide scrolled to top when navigating
const _show=show;
window.show=show=function(i){_show(i);const a=els[cur];if(a)a.scrollTop=0;};
show(0);
</script>
</body>
</html>
