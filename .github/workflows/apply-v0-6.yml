name: Apply v0.6 Bundle

on:
  push:
    branches:
      - agent/technical-decision-mvp-factory
    paths:
      - ".v0_6_bundle/**"
      - ".github/workflows/apply-v0-6.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".v0_6_bundle/**"
      - ".github/workflows/apply-v0-6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/technical-decision-mvp-factory
          fetch-depth: 0

      - name: Reconstruct and extract bundle
        run: |
          cat .v0_6_bundle/part-* > /tmp/v0_6_bundle.b64
          base64 -d /tmp/v0_6_bundle.b64 > /tmp/v0_6_bundle.tar.xz
          tar -xJf /tmp/v0_6_bundle.tar.xz -C .

      - name: Verify PM Prototype OS
        run: python3 pm-prototype-os/scripts/verify_os.py

      - name: Commit verified overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md pm-prototype-os
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Add Technical Decision OS and MVP Factory"
          git push origin HEAD:agent/technical-decision-mvp-factory
