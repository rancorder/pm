name: Materialize v0.6

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-v0-6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Build verified commit on staging branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --branch agent/technical-decision-mvp-factory "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" work
          cd work
          cat .v0_6_bundle/part-* > /tmp/v0_6_bundle.b64
          base64 -d /tmp/v0_6_bundle.b64 > /tmp/v0_6_bundle.tar.xz
          tar -xJf /tmp/v0_6_bundle.tar.xz -C .
          python3 pm-prototype-os/scripts/verify_os.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md pm-prototype-os
          git commit -m "Add Technical Decision OS and MVP Factory"
          echo "GENERATED_SHA=$(git rev-parse HEAD)"
          git push --force origin HEAD:refs/heads/automation/v0-6-generated
